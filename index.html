<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Second Brain</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#fff;--bg2:#f8f9fa;--text:#1a1a2e;--text2:#555;--card:#fff;--card-border:#e0e0e0;--shadow:0 2px 8px rgba(0,0,0,0.1);--input-bg:#f0f0f0;--accent:#ffd700;--panel-w:380px}
[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--text:#e6edf3;--text2:#8b949e;--card:#161b22;--card-border:#30363d;--shadow:0 2px 8px rgba(0,0,0,0.4);--input-bg:#21262d;--accent:#ffd700}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}
header{padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:1000}
header h1{font-size:16px;font-weight:700;white-space:nowrap}
header h1 span{color:var(--accent)}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.search-wrap{position:relative}
.search-wrap input{padding:6px 10px 6px 28px;border-radius:6px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);font-size:12px;width:150px}
.search-wrap i{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:11px}
.filter-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);cursor:pointer;font-size:11px;white-space:nowrap}
.filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.filter-btn.route-mode{background:#4488ff;color:#fff;border-color:#4488ff}
.filter-btn.route-mode.active{background:#ff4444}
.theme-btn{padding:4px 8px;border-radius:6px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);cursor:pointer}
#stats{font-size:11px;color:var(--text2);white-space:nowrap}
#stats b{color:var(--text)}
.route-info{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;margin:4px 8px;font-size:12px;display:none;box-shadow:var(--shadow);z-index:1000}
.route-info .steps{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.route-info .step{padding:3px 8px;border-radius:4px;background:var(--input-bg);font-size:11px;cursor:pointer}
.route-info .step:hover{background:var(--accent);color:#000}
.route-info .step .num{font-weight:700;margin-right:4px}
.main-wrap{display:flex;flex:1;overflow:hidden}
#map{flex:1;height:100%}
#sidePanel{width:var(--panel-w);background:var(--bg2);border-left:1px solid var(--card-border);overflow-y:auto;display:none;flex-direction:column;z-index:1}
#sidePanel.open{display:flex}
.panel-header{padding:14px 16px;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:10px}
.panel-header h2{font-size:16px;font-weight:700;flex:1}
.panel-close{padding:4px 8px;border-radius:6px;border:none;background:var(--input-bg);color:var(--text);cursor:pointer;font-size:14px}
.panel-body{padding:16px;flex:1;overflow-y:auto;font-size:13px;line-height:1.6}
.panel-body .cat-badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;margin-bottom:10px}
.panel-body .desc{font-size:13px;color:var(--text2);margin-bottom:12px}
.panel-body .section{margin-bottom:16px}
.panel-body .section h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--card-border)}
.panel-body table{width:100%;border-collapse:collapse;font-size:12px}
.panel-body td{padding:4px 8px;border-bottom:1px solid var(--card-border)}
.panel-body td:first-child{font-weight:600;color:var(--text2);width:35%}
.panel-body .media-grid{display:flex;flex-direction:column;gap:8px}
.panel-body .media-grid a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600;color:#fff}
.panel-body .conn-list{display:flex;flex-direction:column;gap:4px}
.panel-body .conn-item{padding:6px 10px;border-radius:6px;background:var(--input-bg);font-size:12px;cursor:pointer}
.panel-body .conn-item:hover{background:var(--card-border);transform:translateX(4px)}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2);padding:40px;text-align:center}
.panel-empty i{font-size:48px;margin-bottom:16px;opacity:0.5}
.gm-style-iw-ch{display:none!important}
.gm-ui-hover-effect{display:none!important}
.gm-style-iw-d{overflow:auto!important;padding:8px!important}
.info-window{max-width:280px;font-size:13px;font-family:system-ui}
.info-window h2{font-size:14px;margin-bottom:4px}
.info-window .cat-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:4px}
.info-window .desc{font-size:11px;color:#555;margin:3px 0}
.info-window table{width:100%;font-size:11px;border-collapse:collapse;margin:4px 0}
.info-window td{padding:2px 4px;border-bottom:1px solid #eee}
.info-window td:first-child{font-weight:600;color:#555;width:40%}
.info-window .panel-btn{padding:5px;border-radius:4px;border:none;background:#ffd700;color:#000;font-weight:700;font-size:11px;cursor:pointer;width:100%;text-align:center;margin-top:6px}
@media(max-width:768px){
  header h1{font-size:14px}.search-wrap input{width:100px;font-size:11px}.filter-btn{font-size:10px;padding:3px 7px}
  .main-wrap{flex-direction:column}#sidePanel{width:100%;max-height:50vh;border-left:none;border-top:1px solid var(--card-border)}
}
</style>
</head>
<body>
<header>
  <h1>🧠 <span>Spatial</span> Brain</h1>
  <div class="controls">
    <div class="search-wrap"><i class="fas fa-search"></i>
      <input type="text" id="search" placeholder="Cari node atau tempat...">
    </div>
    <button class="filter-btn" id="placesBtn" style="display:none" onclick="togglePlaces()"><i class="fas fa-map-pin"></i> Tempat</button>
    <button class="filter-btn route-mode" id="routeBtn" onclick="toggleRouteMode()"><i class="fas fa-route"></i> Rute</button>
    <div id="filters" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    <span id="stats">0</span>
  </div>
</header>
<div id="routeInfo" class="route-info"></div>
<div class="main-wrap">
  <div id="map"></div>
  <div id="sidePanel">
    <div class="panel-header"><h2 id="panelTitle">Detail</h2><button class="panel-close" onclick="closePanel()"><i class="fas fa-times"></i></button></div>
    <div class="panel-body" id="panelBody"><div class="panel-empty"><i class="fas fa-map-marker-alt"></i><p>Klik node di peta</p></div></div>
  </div>
</div>

<script>
const DATA_URL='data/master.geojson';
let map,markers=[],allFeatures=[],allLines=[],infoWindow;
let lines=[],activeFilter='all',routeMode=false,routeStart=null;
let routePoly=[],routeLayer=[],nodeIndex={},indexBuilt=false,autocomplete=null,placesActive=false;

const CATS={
  knt:{label:'Kantor',emoji:'🏢',color:'#ff4444'},klg:{label:'Kilang',emoji:'🏭',color:'#ffd700'},
  ofs:{label:'Offshore',emoji:'🌊',color:'#4488ff'},dep:{label:'Depot',emoji:'📦',color:'#999'},
  geo:{label:'Geothermal',emoji:'🌋',color:'#44bb44'},ons:{label:'Onshore',emoji:'🛢️',color:'#444'},
  lng:{label:'LNG',emoji:'🧊',color:'#ff8800'},pgn:{label:'PGN',emoji:'🔥',color:'#aa44ff'},
  ihc:{label:'RS IHC',emoji:'🏥',color:'#44ddff'},edu:{label:'Pelajaran',emoji:'📚',color:'#ff6b6b'},
};

// ===== INIT GOOGLE MAP =====
function initMap(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:-2.5,lng:118},zoom:5,
    mapTypeId:google.maps.MapTypeId.HYBRID,
    mapTypeControl:true,
    mapTypeControlOptions:{style:google.maps.MapTypeControlStyle.HORIZONTAL_BAR,position:google.maps.ControlPosition.TOP_RIGHT},
    streetViewControl:true,
    fullscreenControl:true,
    zoomControl:true,
    styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]}]
  });
  infoWindow=new google.maps.InfoWindow();
  loadData();
  initPlaces();
}

// ===== LOAD DATA =====
async function loadData(){
  try{
    const resp=await fetch(DATA_URL);
    const data=await resp.json();
    allFeatures=data.features||[];allLines=data.lines||[];
    buildIndex();buildFilters();renderLines();renderNodes();
  }catch(e){document.getElementById('stats').textContent='Error loading data';console.error(e)}
}

function buildIndex(){
  nodeIndex={};
  allFeatures.forEach(f=>{
    const p=f.properties;
    nodeIndex[p.id]={id:p.id,title:p.title,emoji:p.emoji||'📌',category:p.category,tags:p.tags||[],connections:p.connections||[],lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],accuracy:p.accuracy||'medium',metadata:p.metadata||{},media:p.media||{},description:p.description||'',markerColor:p.style?.marker_color||CATS[p.category]?.color||'#888'};
  });
  indexBuilt=true;
}

function buildFilters(){
  const cats={};
  allFeatures.forEach(f=>{const c=f.properties.category;cats[c]=(cats[c]||0)+1});
  let h=`<button class="filter-btn active" data-cat="all" onclick="setFilter('all')">Semua (${allFeatures.length})</button>`;
  Object.entries(cats).forEach(([k,v])=>{
    const cat=CATS[k]||{label:k,emoji:'📌',color:'#888'};
    h+=`<button class="filter-btn" data-cat="${k}" onclick="setFilter('${k}')" style="border-left:3px solid ${cat.color}">${cat.emoji} ${v}</button>`;
  });
  document.getElementById('filters').innerHTML=h;
  updateStats();
}

function updateStats(){document.getElementById('stats').innerHTML=`<b>${allFeatures.length}</b> n · <b>${allLines.length}</b> l · tampil <b>${markers.filter(m=>m.getMap()).length}</b>`;}

function setFilter(cat){
  activeFilter=cat;
  document.querySelectorAll('#filters .filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  renderNodes();
}

function toggleRouteMode(){
  routeMode=!routeMode;
  const btn=document.getElementById('routeBtn');
  btn.classList.toggle('active',routeMode);
  btn.innerHTML=routeMode?'<i class="fas fa-times"></i> Batal':'<i class="fas fa-route"></i> Rute';
  if(!routeMode){routeStart=null;clearRoute();}
  else document.getElementById('routeInfo').innerHTML='Klik titik AWAL';
  document.getElementById('routeInfo').style.display=routeMode?'block':'none';
}

function clearRoute(){
  routePoly.forEach(p=>p.setMap(null));
  routeLayer.forEach(m=>m.setMap(null));
  routePoly=[];routeLayer=[];
  document.getElementById('routeInfo').style.display='none';
}

// ===== SVG CIRCLE MARKER =====
function makeIcon(color,size,opacity){
  const s=size*2;
  return {
    url:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}"><circle cx="${size}" cy="${size}" r="${size-2}" fill="${color}" fill-opacity="${opacity}" stroke="white" stroke-width="2"/></svg>`),
    scaledSize:new google.maps.Size(s,s),
    anchor:new google.maps.Point(size,size)
  };
}

// ===== RENDER NODES =====
function renderNodes(){
  markers.forEach(m=>m.setMap(null));markers=[];
  const q=document.getElementById('search').value.toLowerCase();
  allFeatures.forEach(f=>{
    const p=f.properties,cat=CATS[p.category]||{label:'?',emoji:'📌',color:'#888'};
    const inF=activeFilter==='all'||p.category===activeFilter;
    const inS=!q||p.title.toLowerCase().includes(q)||p.tags?.some(t=>t.toLowerCase().includes(q));
    if(!inF||!inS)return;
    const sz=p.accuracy==='high'?10:p.accuracy==='medium'?8:6;
    const op=p.accuracy==='low'?0.5:1;
    const clr=p.style?.marker_color||cat.color;
    const lat=f.geometry.coordinates[1],lng=f.geometry.coordinates[0];
    
    const marker=new google.maps.Marker({
      position:{lat,lng},map,
      icon:makeIcon(clr,sz,op),
      title:p.title,
      label:{text:p.emoji||'📌',fontSize:'10px'}
    });
    
    // Build rich info card with ALL data visible
    let info=`<div class="info-window">`;
    info+=`<div style="display:flex;gap:8px;align-items:start;margin-bottom:6px">`;
    info+=`<div style="font-size:24px">${p.emoji||'📌'}</div>`;
    info+=`<div><h2 style="margin:0;font-size:15px">${p.title}</h2>`;
    info+=`<span class="cat-badge" style="background:${cat.color};color:${cat.color==='#ffd700'?'#000':'#fff'};font-size:10px">${cat.emoji} ${cat.label}</span>`;
    info+=`<span style="font-size:10px;color:#888;margin-left:6px">${p.accuracy==='high'?'✅':p.accuracy==='medium'?'⚠️':'❌'} ${p.accuracy}</span>`;
    info+=`</div></div>`;
    if(p.description)info+=`<div style="font-size:11px;color:#555;margin:4px 0">${p.description}</div>`;
    if(p.metadata&&Object.keys(p.metadata).length>0){
      info+='<table>';
      Object.entries(p.metadata).forEach(([k,v])=>info+=`<tr><td>${k.replace(/_/g,' ')}</td><td><b>${v}</b></td></tr>`);
      info+='</table>';
    }
    // Connections in info window
    if(p.connections&&p.connections.length>0){
      info+='<div style="margin:4px 0;font-size:11px"><b>🔗 Terhubung:</b> ';
      p.connections.slice(0,3).forEach(c=>{
        const t=nodeIndex[c.id];
        if(t)info+=`<span style="background:#f0f0f0;padding:1px 5px;border-radius:3px;margin:1px">${t.emoji||''} ${t.title}</span> `;
      });
      info+='</div>';
    }
    // Street View thumbnail
    info+=`<div style="margin:4px 0;border-radius:6px;overflow:hidden"><img src="https://maps.googleapis.com/maps/api/streetview?size=280x100&location=${lat},${lng}&fov=80&key=AIzaSyBm6lkpcCCz6o8DH6K0afQsNF_jnwNXCeo" style="width:100%;display:block" onerror="this.style.display='none'" alt="street view"></div>`;
    info+=`<button class="panel-btn" onclick="closeInfo();openPanel('${p.id}')">📋 Detail Lengkap →</button>`;
    if(routeMode&&p.id){
      if(!routeStart)info+=`<button class="panel-btn" style="background:#4488ff;color:#fff;margin-top:4px" onclick="event.stopPropagation();startRoute('${p.id}')">🚀 Awal Rute</button>`;
      else if(routeStart!==p.id)info+=`<button class="panel-btn" style="background:#ff4444;color:#fff;margin-top:4px" onclick="event.stopPropagation();showRoute('${routeStart}','${p.id}')">📍 Rute</button>`;
    }
    info+='</div>';
    
    marker.addListener('click',()=>{
      infoWindow.setContent(info);
      infoWindow.open(map,marker);
      openPanel(p.id);
    });
    markers.push(marker);
  });
  updateStats();
}

function closeInfo(){infoWindow.close();}

function startRoute(id){
  routeStart=id;const n=nodeIndex[id];
  document.getElementById('routeInfo').innerHTML=`Awal: ${n.emoji} ${n.title}. Klik Tujuan.`;
  document.getElementById('routeInfo').style.display='block';
  map.setCenter({lat:n.lat,lng:n.lng});map.setZoom(13);
  renderNodes();
}

// ===== ROUTE + DISTANCE MATRIX =====
function showRoute(startId,endId){
  const path=findPath(startId,endId);
  if(!path||path.length<2){
    document.getElementById('routeInfo').innerHTML='Tidak ada jalur. Coba node lain.';
    return;
  }
  clearRoute();
  const pathNodes=path.map(id=>nodeIndex[id]).filter(Boolean);
  const latlngs=pathNodes.map(n=>({lat:n.lat,lng:n.lng}));
  
  // Draw polyline
  const poly=new google.maps.Polyline({path:latlngs,strokeColor:'#ff4444',strokeWeight:4,strokeOpacity:0.8});
  poly.setMap(map);routePoly.push(poly);
  
  // Step markers
  pathNodes.forEach((n,i)=>{
    const mkr=new google.maps.Marker({
      position:{lat:n.lat,lng:n.lng},map,
      label:{text:`${i+1}`,color:'#fff',fontSize:'11px',fontWeight:'bold'},
      icon:makeIcon('#ff4444',14,0.9)
    });
    mkr.addListener('click',()=>{openPanel(n.id);});
    routeLayer.push(mkr);
  });
  
  // Fit bounds
  const bounds=new google.maps.LatLngBounds();
  latlngs.forEach(ll=>bounds.extend(ll));
  map.fitBounds(bounds);
  
  // Route info
  let html=`<b>Rute</b> (${path.length} langkah)`;
  
  // Distance Matrix
  if(window.google&&latlngs.length>1){
    try{
      new google.maps.DistanceMatrixService().getDistanceMatrix(
        {origins:[latlngs[0]],destinations:[latlngs[latlngs.length-1]],travelMode:'DRIVING',unitSystem:google.maps.UnitSystem.METRIC},
        function(r,s){
          if(s==='OK'&&r.rows[0]&&r.rows[0].elements[0]&&r.rows[0].elements[0].distance){
            const e=r.rows[0].elements[0];
            html+=`<div style="font-size:11px;color:var(--text2);margin:4px 0">🚗 ${e.distance.text} · ⏱️ ${e.duration.text}</div>`;
            document.getElementById('routeInfo').innerHTML=html+'<div class="steps">'+path.map((id,i)=>{const n=nodeIndex[id];return n?`<span class="step" onclick="map.setCenter({lat:${n.lat},lng:${n.lng}});map.setZoom(13);openPanel('${id}')"><span class="num">${i+1}.</span> ${n.emoji} ${n.title}</span>`:'';}).join('')+'</div>';
          }
        });
    }catch(e){}
  }else{
    document.getElementById('routeInfo').innerHTML=html+'<div class="steps">'+path.map((id,i)=>{const n=nodeIndex[id];return n?`<span class="step" onclick="map.setCenter({lat:${n.lat},lng:${n.lng}});map.setZoom(13);openPanel('${id}')"><span class="num">${i+1}.</span> ${n.emoji} ${n.title}</span>`:'';}).join('')+'</div>';  
  }
}

function findPath(startId,endId){
  if(!indexBuilt)return null;
  const queue=[[startId]],visited=new Set([startId]);
  while(queue.length>0){
    const path=queue.shift(),node=path[path.length-1];
    if(node===endId)return path;
    const n=nodeIndex[node];if(!n)continue;
    const neighbors=[];
    n.connections.forEach(c=>{if(c.id)neighbors.push(c.id)});
    Object.values(nodeIndex).forEach(other=>{other.connections.forEach(c=>{if(c.id===node&&!neighbors.includes(other.id))neighbors.push(other.id);});});
    neighbors.forEach(nb=>{if(!visited.has(nb)&&nodeIndex[nb]){visited.add(nb);queue.push([...path,nb]);}});
  }
  return null;
}

// ===== SIDE PANEL with Google Place Details =====
function openPanel(id){
  const n=nodeIndex[id];if(!n)return;
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('panelTitle').textContent=`${n.emoji||'📌'} ${n.title}`;
  const cat=CATS[n.category]||{emoji:'📌',label:'?',color:'#888'};
  let h=`<span class="cat-badge" style="background:${cat.color};color:${cat.color==='#ffd700'?'#000':'#fff'}">${cat.emoji} ${cat.label}</span>`;
  h+=`<div class="desc">${n.description||''}</div>`;
  
  // Google Place Photo (if Places API finds it)
  h+=`<div id="gPlacePhoto" style="margin-bottom:10px;border-radius:8px;overflow:hidden;display:none"><img id="gPlaceImg" style="width:100%;display:block;max-height:180px;object-fit:cover"></div>`;
  h+=`<div id="gPlaceInfo" style="font-size:12px;margin-bottom:8px;display:none"></div>`;
  
  // Try to get Google Place details using textSearch (more reliable)
  if(window.google&&google.maps&&google.maps.places){
    const service=new google.maps.places.PlacesService(document.createElement('div'));
    service.textSearch({query:`${n.title} Indonesia`},function(results,status){
      if(status==='OK'&&results&&results[0]){
        const p=results[0];
        // Photo
        if(p.photos&&p.photos[0]){
          document.getElementById('gPlaceImg').src=p.photos[0].getUrl({maxWidth:400,maxHeight:200});
          document.getElementById('gPlacePhoto').style.display='block';
        }
        // Info
        let gi='<div style="background:var(--input-bg);border-radius:6px;padding:8px;font-size:11px">';
        gi+=`<b>${p.name}</b>`;
        if(p.rating)gi+=`<br>⭐ ${p.rating} (${p.user_ratings_total||0})`;
        if(p.formatted_address)gi+=`<br>📍 ${p.formatted_address}`;
        gi+=`</div>`;
        document.getElementById('gPlaceInfo').innerHTML=gi;
        document.getElementById('gPlaceInfo').style.display='block';
      }
    });
  }
  
  if(n.metadata&&Object.keys(n.metadata).length>0){
    h+='<div class="section"><h3>Data</h3><table>';
    Object.entries(n.metadata).forEach(([k,v])=>h+=`<tr><td>${k.replace(/_/g,' ')}</td><td><b>${v}</b></td></tr>`);
    h+='</table></div>';
  }
  if(n.connections&&n.connections.length>0){
    h+='<div class="section"><h3>Hubungan</h3><div class="conn-list">';
    n.connections.forEach(c=>{
      const t=nodeIndex[c.id];
      h+=`<div class="conn-item" onclick="${t?'openPanel(\''+c.id+'\')':''}"><span style="color:var(--accent);font-weight:700;margin-right:6px">${c.relation==='prerequisite'?'←':c.relation==='next'?'→':'↔'}</span>${c.label||''}${t?` <span style="color:var(--text2)">${t.emoji} ${t.title}</span>`:''}</div>`;
    });
    h+='</div></div>';
  }
  if(n.media&&(n.media.youtube||n.media.links)){
    h+='<div class="section"><h3>Media</h3><div class="media-grid">';
    if(n.media.youtube)n.media.youtube.forEach(v=>h+=`<a href="${v.url}" target="_blank" style="background:#ff0000"><i class="fab fa-youtube"></i> ${v.title||'YouTube'}</a>`);
    if(n.media.links)n.media.links.forEach(l=>h+=`<a href="${l.url}" target="_blank" style="background:#333"><i class="fas fa-link"></i> ${l.title}</a>`);
    h+='</div></div>';
  }
  h+='<div class="section"><h3>Lokasi</h3><table>';
  h+=`<tr><td>Lat</td><td>${n.lat.toFixed(5)}</td></tr><tr><td>Lng</td><td>${n.lng.toFixed(5)}</td></tr>`;
  h+=`<tr><td>Akurasi</td><td>${n.accuracy==='high'?'✅':n.accuracy==='medium'?'⚠️':'❌'} ${n.accuracy}</td></tr>`;
  h+='</table>';
  h+=`<div style="margin-top:6px;border-radius:8px;overflow:hidden"><img src="https://maps.googleapis.com/maps/api/streetview?size=360x160&location=${n.lat},${n.lng}&fov=80&key=AIzaSyBm6lkpcCCz6o8DH6K0afQsNF_jnwNXCeo" style="width:100%;display:block" onerror="this.style.display='none'"></div>`;
  h+=`<div style="display:flex;gap:4px;margin-top:6px">`;
  h+=`<a href="https://www.google.com/maps?q=${n.lat},${n.lng}&layer=c" target="_blank" style="flex:1;padding:5px;border-radius:5px;background:#4285f4;color:#fff;text-decoration:none;font-size:10px;text-align:center"><i class="fas fa-street-view"></i> Street</a>`;
  h+=`<a href="https://www.google.com/maps/dir//${n.lat},${n.lng}" target="_blank" style="flex:1;padding:5px;border-radius:5px;background:#34a853;color:#fff;text-decoration:none;font-size:10px;text-align:center"><i class="fas fa-directions"></i> Route</a>`;
  h+=`<a href="https://www.google.com/maps?q=${n.lat},${n.lng}" target="_blank" style="flex:1;padding:5px;border-radius:5px;background:#ea4335;color:#fff;text-decoration:none;font-size:10px;text-align:center"><i class="fas fa-map-marker-alt"></i> Maps</a>`;
  h+=`</div></div>`;
  if(n.tags&&n.tags.length>0){
    h+='<div class="section"><h3>Tag</h3><div style="display:flex;gap:4px;flex-wrap:wrap">';
    n.tags.forEach(t=>h+=`<span style="padding:3px 8px;border-radius:4px;background:var(--input-bg);font-size:11px">${t}</span>`);
    h+='</div></div>';
  }
  document.getElementById('panelBody').innerHTML=h;
}
function closePanel(){document.getElementById('sidePanel').classList.remove('open');}

// ===== SUPPLY CHAIN LINES =====
function renderLines(){
  lines.forEach(l=>l.setMap(null));lines=[];
  allLines.forEach(line=>{
    const path=line.geometry.coordinates.map(c=>({lat:c[1],lng:c[0]}));
    const color=line.properties.color||'#4488ff';
    const poly=new google.maps.Polyline({path,strokeColor:color,strokeWeight:2,strokeOpacity:0.5,map});
    lines.push(poly);
  });
}

// ===== PLACES AUTOCOMPLETE =====
function initPlaces(){
  const input=document.getElementById('search');
  if(window.google&&google.maps&&google.maps.places){
    autocomplete=new google.maps.places.Autocomplete(input,{types:['establishment','geocode'],componentRestrictions:{country:'id'}});
    autocomplete.addListener('place_changed',()=>{
      const place=autocomplete.getPlace();
      if(place.geometry){
        const lat=place.geometry.location.lat(),lng=place.geometry.location.lng();
        map.setCenter({lat,lng});map.setZoom(15);
        new google.maps.Marker({position:{lat,lng},map,icon:makeIcon('#ff4444',10,0.8)});
        infoWindow.setContent(`<b>${place.name}</b><br>${place.formatted_address||''}`);
        infoWindow.setPosition({lat,lng});infoWindow.open(map);
      }
    });
    document.getElementById('placesBtn').style.display='inline-block';
  }
}
// initMap already calls initPlaces, no need for setTimeout

function togglePlaces(){
  placesActive=!placesActive;
  document.getElementById('placesBtn').classList.toggle('active',placesActive);
  document.getElementById('search').placeholder=placesActive?'Cari tempat (SPBU, Monas, dll)...':'Cari node atau tempat...';
}

// ===== THEME =====
function toggleTheme(){
  const d=document.documentElement,isDark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',isDark?'light':'dark');
  document.querySelector('.theme-btn i').className=isDark?'fas fa-moon':'fas fa-sun';
  // No need to restyle map - Google auto-adjusts
}

// ===== SEARCH NODES =====
document.getElementById('search').addEventListener('input',function(){
  if(!placesActive)renderNodes();
});

// ===== START =====
// initMap called automatically via URL callback
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBm6lkpcCCz6o8DH6K0afQsNF_jnwNXCeo&libraries=places&v=weekly&callback=initMap" async defer></script>
