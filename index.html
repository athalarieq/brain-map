<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Second Brain</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #fff; --bg2: #f8f9fa; --text: #1a1a2e; --text2: #555;
  --card: #fff; --card-border: #e0e0e0; --shadow: 0 2px 8px rgba(0,0,0,0.1);
  --input-bg: #f0f0f0; --accent: #ffd700;
  --line-color: #4488ff; --line-width: 3px;
}
[data-theme="dark"] {
  --bg: #0d1117; --bg2: #161b22; --text: #e6edf3; --text2: #8b949e;
  --card: #161b22; --card-border: #30363d; --shadow: 0 2px 8px rgba(0,0,0,0.4);
  --input-bg: #21262d; --accent: #ffd700;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
body { background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }

/* HEADER */
header { padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--card-border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header h1 { font-size:18px; font-weight:700; }
header h1 span { color:var(--accent); }
.controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto; }
.search-wrap { position:relative; }
.search-wrap input { padding:8px 12px 8px 32px; border-radius:8px; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text); font-size:13px; width:200px; }
.search-wrap i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:13px; }
.filter-btn { padding:6px 12px; border-radius:8px; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text); cursor:pointer; font-size:12px; }
.filter-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }
.theme-btn { padding:6px 10px; border-radius:8px; border:1px solid var(--card-border); background:var(--input-bg); color:var(--text); cursor:pointer; }
#stats { font-size:12px; color:var(--text2); }
#stats b { color:var(--text); }

/* MAP */
#map { flex:1; width:100%; }

/* LEAFLET CUSTOM */
.leaflet-container { background:var(--bg2) !important; }
.leaflet-popup-content-wrapper { background:var(--card) !important; color:var(--text) !important; border-radius:12px !important; box-shadow:var(--shadow) !important; }
.leaflet-popup-tip { background:var(--card) !important; }
.popup-card { max-width:340px; font-size:13px; }
.popup-card h2 { font-size:16px; margin-bottom:4px; }
.popup-card .cat-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; margin-bottom:8px; }
.popup-card table { width:100%; border-collapse:collapse; margin:8px 0; }
.popup-card td { padding:3px 6px; border-bottom:1px solid var(--card-border); font-size:12px; }
.popup-card td:first-child { font-weight:600; color:var(--text2); width:40%; }
.popup-card .media-links { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.popup-card .media-links a { text-decoration:none; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:600; color:#fff; }
.popup-card .desc { font-size:12px; color:var(--text2); margin:4px 0; }
.popup-card .accuracy { font-size:11px; color:var(--text2); }
</style>
</head>
<body>

<header>
  <h1>🧠 <span>Spatial</span> Second Brain</h1>
  <div class="controls">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="search" placeholder="Cari node..." oninput="filterNodes()">
    </div>
    <div id="filters"></div>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    <span id="stats">0 node</span>
  </div>
</header>

<div id="map"></div>

<script>
const DATA_URL = 'data/master.geojson';
let map, markers = [], allFeatures = [], allLines = [];
let linesLayer, activeFilter = 'all';

// ===== CATEGORY DEFINITIONS =====
const CATS = {
  knt: {label:'Kantor', emoji:'🏢', color:'#ff4444'},
  klg: {label:'Kilang', emoji:'🏭', color:'#ffd700'},
  ofs: {label:'Offshore', emoji:'🌊', color:'#4488ff'},
  dep: {label:'Depot', emoji:'📦', color:'#ffffff'},
  geo: {label:'Geothermal', emoji:'🌋', color:'#44bb44'},
  ons: {label:'Onshore', emoji:'🛢️', color:'#444444'},
  lng: {label:'LNG', emoji:'🧊', color:'#ff8800'},
  pgn: {label:'PGN', emoji:'🔥', color:'#aa44ff'},
  ihc: {label:'RS IHC', emoji:'🏥', color:'#44ddff'},
  edu: {label:'Pelajaran', emoji:'📚', color:'#ff6b6b'},
};

// ===== INIT MAP =====
map = L.map('map', {center: [-2.5, 118], zoom: 5, zoomControl: true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://osm.org">OpenStreetMap</a>'
}).addTo(map);

// ===== LOAD DATA =====
async function loadData() {
  try {
    const resp = await fetch(DATA_URL);
    const data = await resp.json();
    allFeatures = data.features || [];
    allLines = data.lines || [];
    document.getElementById('stats').innerHTML = `<b>${allFeatures.length}</b> node · <b>${allLines.length}</b> jalur`;
    buildFilters();
    renderLines();
    renderNodes();
  } catch(e) {
    document.getElementById('stats').textContent = '❌ Gagal load data';
    console.error(e);
  }
}

// ===== BUILD FILTERS =====
function buildFilters() {
  const cats = {};
  allFeatures.forEach(f => { const c = f.properties.category; cats[c] = (cats[c]||0)+1; });
  let html = `<button class="filter-btn active" data-cat="all" onclick="setFilter('all')">Semua (${allFeatures.length})</button>`;
  Object.entries(cats).forEach(([k,v]) => {
    const cat = CATS[k] || {label:k,emoji:'📌',color:'#888'};
    html += `<button class="filter-btn" data-cat="${k}" onclick="setFilter('${k}')" style="border-left:3px solid ${cat.color}">${cat.emoji} ${cat.label} (${v})</button>`;
  });
  document.getElementById('filters').innerHTML = html;
}

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  filterNodes();
}

// ===== RENDER =====
function renderNodes() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const query = document.getElementById('search').value.toLowerCase();

  allFeatures.forEach(f => {
    const p = f.properties;
    const cat = CATS[p.category] || {label:'Lainnya',emoji:'📌',color:'#888'};
    const inFilter = activeFilter === 'all' || p.category === activeFilter;
    const inSearch = !query || p.title.toLowerCase().includes(query) || p.tags?.some(t=>t.toLowerCase().includes(query));
    if (!inFilter || !inSearch) return;

    const size = p.accuracy === 'high' ? 10 : p.accuracy === 'medium' ? 8 : 6;
    const opacity = p.accuracy === 'low' ? 0.5 : 1;
    const m = L.circleMarker(f.geometry.coordinates.reverse(), {
      radius: size, fillColor: p.style?.marker_color || cat.color,
      color: '#fff', weight: 2, opacity: 1, fillOpacity: opacity
    });
    f.geometry.coordinates.reverse(); // restore

    // Popup HTML
    let popup = `<div class="popup-card"><h2>${p.emoji||'📌'} ${p.title}</h2>`;
    popup += `<span class="cat-badge" style="background:${cat.color};color:${cat.color==='#ffd700'||cat.color==='#fff'?'#000':'#fff'}">${cat.emoji} ${cat.label}</span>`;
    popup += `<span style="font-size:11px;display:inline-flex;gap:4px;align-items:center;margin-left:6px;">`;
    popup += p.accuracy === 'high' ? '✅ Akurat' : p.accuracy === 'medium' ? '⚠️ ±1-5km' : '❌ ±5-10km';
    popup += `</span>`;
    if (p.description) popup += `<div class="desc">${p.description}</div>`;

    if (p.metadata && Object.keys(p.metadata).length > 0) {
      popup += '<table>';
      Object.entries(p.metadata).forEach(([k,v]) => {
        const label = k.replace(/_/g,' ');
        popup += `<tr><td>${label}</td><td><b>${v}</b></td></tr>`;
      });
      popup += '</table>';
    }

    // Connections
    if (p.connections && p.connections.length > 0) {
      popup += '<div style="margin-top:6px;font-size:11px"><b>🔗 Terhubung ke:</b><br>';
      p.connections.forEach(c => popup += `<span style="color:var(--text2)">${c.label||'→'}</span><br>`);
      popup += '</div>';
    }

    // Media links
    if (p.media) {
      popup += '<div class="media-links">';
      if (p.media.youtube && p.media.youtube.length > 0) {
        popup += `<a href="${p.media.youtube[0].url}" target="_blank" style="background:#ff0000"><i class="fab fa-youtube"></i> YouTube</a>`;
      }
      if (p.media.links && p.media.links.length > 0) {
        p.media.links.forEach(l => popup += `<a href="${l.url}" target="_blank" style="background:#333"><i class="fas fa-link"></i> ${l.title}</a>`);
      }
      popup += '</div>';
    }

    popup += '</div>';
    m.bindPopup(popup, {maxWidth:360, className:'custom-popup'});
    m.addTo(map);
    markers.push(m);
  });

  document.getElementById('stats').innerHTML = `<b>${allFeatures.length}</b> node · <b>${allLines.length}</b> jalur · tampil <b>${markers.length}</b>`;
}

// ===== SUPPLY CHAIN LINES =====
function renderLines() {
  if (linesLayer) map.removeLayer(linesLayer);
  linesLayer = L.layerGroup();
  allLines.forEach(line => {
    const coords = line.geometry.coordinates.map(c => [c[1], c[0]]);
    const color = line.properties.color || '#4488ff';
    const poly = L.polyline(coords, {color, weight:3, opacity:0.7});
    poly.bindPopup(`<b>${line.properties.title}</b><br>${line.properties.description||''}`);
    linesLayer.addLayer(poly);
  });
  linesLayer.addTo(map);
}

// ===== SEARCH & FILTER =====
function filterNodes() { renderNodes(); }

// ===== THEME =====
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.querySelector('.theme-btn i').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
}

// ===== GOOGLE MAPS LINK =====
map.on('contextmenu', function(e) {
  const lat = e.latlng.lat.toFixed(5);
  const lng = e.latlng.lng.toFixed(5);
  window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
});

// ===== START =====
loadData();
</script>
</body>
</html>
