<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Memory Palace - Akuntansi Dasar</title>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBm6lkpcCCz6o8DH6K0afQsNF_jnwNXCeo&libraries=places&v=weekly"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{height:100vh;display:flex;flex-direction:column;background:#0d1117;color:#e6edf3}
header{padding:10px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;font-weight:700;color:#ffd700}
header span{font-size:12px;color:#8b949e}
.main-wrap{display:flex;flex:1;overflow:hidden}
#streetview{flex:1;height:100%}
#sidePanel{width:400px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:12px 16px;border-bottom:1px solid #30363d}
.panel-header h2{font-size:14px;font-weight:700;color:#ffd700}
.panel-header .sub{font-size:11px;color:#8b949e;margin-top:2px}
.panel-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.6}
.panel-body h1{font-size:20px;font-weight:700;color:#ffd700;margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid #ffd700}
.panel-body h2{font-size:16px;font-weight:700;color:#58a6ff;margin:12px 0 6px;padding-left:8px;border-left:3px solid #58a6ff}
.panel-body h3{font-size:14px;font-weight:600;color:#3fb950;margin:8px 0 4px;padding-left:16px}
.panel-body p{margin:4px 0 8px;padding-left:16px;color:#c9d1d9}
.panel-body ul{padding-left:32px;margin:4px 0 8px;color:#c9d1d9}
.panel-body li{margin:2px 0}
.panel-body code{background:#0d1117;padding:1px 6px;border-radius:4px;font-size:12px;color:#ffa657}
.panel-body .topic-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.panel-body .topic-btn{padding:4px 10px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:11px}
.panel-body .topic-btn:hover{background:#30363d;color:#ffd700}
.panel-body .topic-btn.active{background:#ffd700;color:#000;border-color:#ffd700}
.sv-label{background:#ffd700;color:#000;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.5);transform:translate(-50%,-100%)}
.sv-label:hover{transform:translate(-50%,-100%) scale(1.05)}
@media(max-width:768px){#sidePanel{width:100%;max-height:50vh}}
</style>
</head>
<body>
<header>
  <h1>🏘️ Memory Palace</h1>
  <span>Akuntansi Dasar — Jl. MH Thamrin Jakarta</span>
</header>
<div class="main-wrap">
  <div id="streetview"></div>
  <div id="sidePanel">
    <div class="panel-header">
      <h2 id="panelTitle">🏠 Pilih Rumah</h2>
      <div class="sub" id="panelSub">Klik marker di Street View</div>
    </div>
    <div class="panel-body" id="panelBody">
      <div style="color:#8b949e;text-align:center;padding:40px">
        <div style="font-size:48px;margin-bottom:16px">🏘️</div>
        <p style="font-size:14px">Memuat Memory Palace...</p>
      </div>
    </div>
  </div>
</div>

<script>
const CONTENT = `# Pengertian Akuntansi
Akuntansi adalah seni pencatatan, penggolongan, dan peringkasan transaksi keuangan.

## Definisi Menurut Para Ahli
- **AICPA**: Seni mencatat, menggolongkan, dan meringkas transaksi
- **IAI**: Proses mengidentifikasi, mengukur, dan melaporkan informasi ekonomi

## Siklus Akuntansi
1. Transaksi terjadi
2. Jurnal umum
3. Buku besar
4. Neraca saldo
5. Penyesuaian
6. Laporan keuangan

## Prinsip Dasar
- Konsep Entitas: Perusahaan terpisah dari pemilik
- Biaya Historis: Aset dicatat sebesar harga perolehan

# Persamaan Dasar Akuntansi
ASET = LIABILITAS + EKUITAS

## Komponen
- **Aset**: Sumber daya perusahaan (kas, piutang, gedung)
- **Liabilitas**: Utang perusahaan
- **Ekuitas**: Hak pemilik

## Contoh
Setor modal Rp10jt: Aset +10jt, Ekuitas +10jt

# Jurnal Umum
Buku harian kronologis transaksi.

## Aturan Debit & Kredit
Aset (+Debit, -Kredit), Liabilitas (-Debit, +Kredit)
Ekuitas (-Debit, +Kredit), Beban (+Debit, -Kredit)

## Contoh Jurnal
Setor modal: Kas (Debit) 10jt, Modal (Kredit) 10jt

# Buku Besar
Kumpulan akun untuk kelompok transaksi.

## Bentuk
- T-Account: Bentuk T sederhana
- Staffel: Bentuk bersaldo

## Daftar Akun
1xxx Aset, 2xxx Liabilitas, 3xxx Ekuitas
4xxx Pendapatan, 5xxx Beban

# Laporan Keuangan
Output akhir siklus akuntansi.

## Laba Rugi
Pendapatan - Beban = Laba/Rugi

## Neraca
ASET = LIABILITAS + EKUITAS

## Arus Kas
Operasi, Investasi, Pendanaan
`;

const BASE_LAT=-6.1865,BASE_LNG=106.8232;
const HOUSES=[
  {id:'h1',title:'Pengertian Akuntansi',emoji:'🏠',topic:0,color:'#ffd700'},
  {id:'h2',title:'Persamaan Dasar',emoji:'🏡',topic:1,color:'#58a6ff'},
  {id:'h3',title:'Jurnal Umum',emoji:'🏘️',topic:2,color:'#3fb950'},
  {id:'h4',title:'Buku Besar',emoji:'🏚️',topic:3,color:'#ffa657'},
  {id:'h5',title:'Laporan Keuangan',emoji:'🏤',topic:4,color:'#ff6b6b'},
];

let topics=[],panorama=null,currentTopic=-1;

function parseMarkdown(md){
  const lines=md.split('\n');
  const topics=[];
  let current=null,sub=null;
  lines.forEach(line=>{
    if(line.startsWith('# ')&&!line.startsWith('## ')){
      current={title:line.replace('# ',''),h2:[],content:[]};
      topics.push(current);sub=null;
    }else if(line.startsWith('## ')&&current){
      sub={title:line.replace('## ',''),content:[]};
      current.h2.push(sub);
    }else{
      if(sub)sub.content.push(line);
      else if(current)current.content.push(line);
    }
  });
  return topics;
}

function renderTopic(idx){
  const t=topics[idx];
  let html='<div class="topic-nav">';
  topics.forEach((tt,i)=>{
    html+=`<div class="topic-btn ${i===idx?'active':''}" onclick="showTopic(${i})">${HOUSES[i]?.emoji||'🏠'} ${tt.title}</div>`;
  });
  html+='</div>';
  html+=`<h1>${t.title}</h1>`;
  t.content.forEach(line=>{
    if(!line.trim())return;
    if(line.startsWith('- **'))html+=`<li><b>${line.replace(/^\- \*\*(.+?)\*\*/,'$1')}</b></li>`;
    else if(line.startsWith('- '))html+=`<li>${line.replace('- ','')}</li>`;
    else if(line.match(/^\d+\.\s/))html+=`<li>${line.replace(/^\d+\.\s/,'')}</li>`;
    else if(line.includes('`'))html+=`<p>${line.replace(/`(.+?)`/g,'<code>$1</code>')}</p>`;
    else if(line.startsWith('|')){}
    else html+=`<p>${line}</p>`;
  });
  t.h2.forEach(h2=>{
    html+=`<h2>${h2.title}</h2>`;
    h2.content.forEach(line=>{
      if(!line.trim())return;
      if(line.startsWith('- **'))html+=`<li><b>${line.match(/\*\*(.+?)\*\*/)?.[1]||''}</b>: ${line.replace(/^\- \*\*(.+?)\*\*:?\s?/,'')}</li>`;
      else if(line.startsWith('- '))html+=`<li>${line.replace('- ','')}</li>`;
      else if(line.match(/^\d+\.\s/))html+=`<li>${line.replace(/^\d+\.\s/,'')}</li>`;
      else if(line.startsWith('|')){}
      else html+=`<p>${line}</p>`;
    });
  });
  return html;
}

function showTopic(idx){
  currentTopic=idx;
  const h=HOUSES[idx];
  document.getElementById('panelTitle').textContent=`${h.emoji} ${h.title}`;
  document.getElementById('panelSub').textContent=`Rumah ${idx+1} dari ${HOUSES.length}`;
  document.getElementById('panelBody').innerHTML=renderTopic(idx);
  // Move street view
  if(panorama){
    const pos={lat:BASE_LAT+(idx+1)*0.0002,lng:BASE_LNG+0.001};
    panorama.setPosition(pos);
    panorama.setPov({heading:90,pitch:0});
  }
}

function init(){
  topics=parseMarkdown(CONTENT);
  // Check Street View
  const sv=new google.maps.StreetViewService();
  sv.getPanorama({location:{lat:BASE_LAT,lng:BASE_LNG},radius:100,preference:'nearest'},function(data,status){
    if(status==='OK'){
      panorama=new google.maps.StreetViewPanorama(document.getElementById('streetview'),{
        position:data.location.latLng,pov:{heading:90,pitch:0},zoom:1,
        addressControl:false,showRoadLabels:true,panControl:true,zoomControl:true,enableCloseButton:false
      });
      // Place house markers
      HOUSES.forEach((house,i)=>{
        const pos={lat:BASE_LAT+(i+1)*0.0002,lng:BASE_LNG+0.001};
        const marker=new google.maps.Marker({position:pos,map:panorama,title:house.title,icon:{path:google.maps.SymbolPath.CIRCLE,scale:0}});
        // Custom overlay label
        const overlay=new google.maps.OverlayView();
        overlay.onAdd=function(){
          const div=document.createElement('div');
          div.style.cssText=`background:${house.color};color:#000;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.5);position:absolute`;
          div.innerHTML=`${house.emoji} ${house.title}`;
          div.onclick=()=>showTopic(i);
          this.getPanes().floatPane.appendChild(div);
          this.div=div;
        };
        overlay.draw=function(){
          if(!this.div)return;
          const proj=this.getProjection();
          const pt=proj.fromLatLngToDivPixel(new google.maps.LatLng(pos.lat,pos.lng));
          if(pt){this.div.style.left=(pt.x-80)+'px';this.div.style.top=(pt.y-40)+'px';}
        };
        overlay.setMap(panorama);
        marker.addListener('click',()=>showTopic(i));
      });
    } else {
      document.getElementById('streetview').innerHTML='<div style="text-align:center;padding:60px;color:#8b949e"><div style="font-size:64px">🗺️</div><p style="margin-top:16px;font-size:16px">Street View tidak tersedia</p><p style="font-size:12px;margin-top:8px">Coba refresh atau buka link ini dari HP</p></div>';
    }
    showTopic(0);
  });
}

(function wait(){if(window.google&&google.maps&&google.maps.StreetViewService){init();}else setTimeout(wait,300);})();
</script>
</body>
</html>
